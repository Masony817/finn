[platformio]
src_dir = src
default_envs = bringup_imu_can

[env]
platform = teensy
; check_src_filters selects our sketch; defects inside vendored library
; dependencies (e.g. FlexCAN_T4 missingReturn) are not ours to gate on.
check_flags = cppcheck: --suppress=*:*/.pio/libdeps/*
board = teensy41
framework = arduino
lib_deps = 
	adafruit/Adafruit BNO08x
	https://github.com/tonton81/FlexCAN_T4.git
	mjbots/Moteus@^1.1.1
	pierremolinaro/ACAN_T4@^1.1.8

[env:bringup_imu_can]
build_src_filter = -<*> +<../sysid/01_imu_can_check>
check_src_filters = +<sysid/01_imu_can_check/>

[env:imu_i2c_full_check]
build_src_filter = -<*> +<../sysid/00_imu_i2c_full_check>
check_src_filters = +<sysid/00_imu_i2c_full_check/>
upload_protocol = teensy-cli

[env:sysid_batch1_wheels_offground]
build_src_filter = -<*> +<../sysid/02_sysid_batch1_wheels_offground>
check_src_filters = +<sysid/02_sysid_batch1_wheels_offground/>
upload_protocol = teensy-cli

[env:sysid_batch2_loaded_ground]
build_src_filter = -<*> +<../sysid/03_sysid_batch2_loaded_ground>
check_src_filters = +<sysid/03_sysid_batch2_loaded_ground/>
upload_protocol = teensy-cli

[env:lqr_balance]
build_src_filter = -<*> +<../control/04_lqr_balance>
check_src_filters = +<control/04_lqr_balance/>
upload_protocol = teensy-cli
