; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
default_envs = bringup_imu_can

[env]
platform = teensy
board = teensy41
framework = arduino
lib_deps = 
	adafruit/Adafruit BNO08x
	https://github.com/tonton81/FlexCAN_T4.git
	mjbots/Moteus@^1.1.1
	pierremolinaro/ACAN_T4@^1.1.8

[env:main]
build_src_filter = +<*>

[env:bringup_imu_can]
build_src_filter = -<*> +<../sysid/01_imu_can_check>

[env:sysid_batch1_wheels_offground]
build_src_filter = -<*> +<../sysid/02_sysid_batch1_wheels_offground>
upload_protocol = teensy-cli

[env:sysid_batch2_loaded_ground]
build_src_filter = -<*> +<../sysid/03_sysid_batch2_loaded_ground>
upload_protocol = teensy-cli
