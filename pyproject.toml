[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finn"]

[project]
name = "finn"
version = "0.1.0"
description = "FINN: self-balancing two-wheeled humanoid"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",          # lqr
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "mujoco>=3.1",
    "scopik",
]

[project.optional-dependencies]
hardware = [
    "moteus-gui",           # moteus lib + moteus_tool + tview
]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "ipython>=8.0",
]

[tool.uv.workspace]
members = ["packages/scopik"]

[tool.uv.sources]
scopik = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".platformio",
    "firmware/finn-mcu/.cache",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# LQR uses conventional uppercase matrix names, and one inline MuJoCo XML
# string is intentionally long.
"tools/check_env.py" = ["N806", "E501"]
