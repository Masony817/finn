[project]
name = "finn"
version = "0.1.0"
description = "FINN: self-balancing two-wheeled humanoid"
requires-python = ">=3.11"
dependencies = [
    # core stack
    "numpy>=1.26",
    "scipy>=1.12",          # lqr
    "matplotlib>=3.8",
    "polars>=0.20",         # log analysis
    "pyyaml>=6.0",

    # hardware comms
    "moteus-gui",           # moteus lib + moteus_tool + tview
    "pyserial>=3.5",        # host <-> Teensy
    "python-can>=4.4",      # CAN-FD support

    # sim
    "mujoco>=3.1",
]

[project.optional-dependencies]
ml = [
    "torch>=2.3",
    "torchvision>=0.18",
    "gymnasium>=0.29",
    "tensorboard>=2.16",
    "wandb>=0.17",
]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
    "ipython>=8.0",
]

# CUDA wheels on Linux only. macOS gets default Pytorch (MPS on Apple Silicon).
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu124", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Environment smoke-check: LQR uses conventional uppercase matrix names
# (A, B, Q, R, P, K), and one inline MuJoCo XML string is intentionally long.
"tools/check_env.py" = ["N806", "E501"]