name: CI

# Two independent gates:
#   - python:   host-side lint, format, and tests for the harness/tools/sim code
#   - firmware: compile + static-analyze the MCU code for the real Teensy target
#
# Both auto-discover new work, so adding a test or a firmware sketch needs no
# changes here: pytest finds new tests, ruff lints the whole repo, and the
# firmware job builds every [env:*] declared in platformio.ini.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (lint, format, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies (locked)
        run: uv sync --extra dev
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Format check (ruff)
        run: uv run ruff format --check .
      - name: Tests (pytest)
        run: uv run pytest -q

  firmware:
    name: firmware (build + static analysis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/finn-mcu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/finn-mcu/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build + static-check every firmware environment
        # Compiling for board=teensy41 is the hardware-fidelity gate: it fails on
        # library/API drift and on flash/RAM overflow. cppcheck (high severity)
        # catches memory/undefined-behavior defects. Environments are read from
        # platformio.ini so new sketches are covered with no edits here.
        run: |
          set -euo pipefail
          envs=$(grep -oE '^\[env:[^]]+\]' platformio.ini | sed -E 's/\[env:(.+)\]/\1/')
          echo "Environments: $envs"
          for env in $envs; do
            echo "::group::build $env"
            pio run -e "$env"
            echo "::endgroup::"
            echo "::group::cppcheck $env"
            pio check -e "$env" --skip-packages --severity=high --fail-on-defect=high
            echo "::endgroup::"
          done
