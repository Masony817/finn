    value: 0.57715
    unit: kg*m^2
    source: cad
    notes: 'Lyy from OnShape full-assembly inertia tensor (Y = lateral/wheel-axle
      axis = pitch axis). Whole robot including wheels and battery. See cad_inertia_tensor_whole_robot
      for full tensor; subtract wheel inertias if building per-body MuJoCo model.

      '
  cad_inertia_tensor_whole_robot:
    source: cad
    notes: 'OnShape full-assembly mass moments of inertia in CAD frame: X=fore-aft,
      Y=lateral (wheel axis), Z=vertical. Whole robot including wheels and battery
      (mass 8.44 kg). Units kg*m^2, converted from kg*mm^2 reported by CAD (divided
      by 1e6). MuJoCo fullinertia order is Ixx Iyy Izz Ixy Ixz Iyz.

      '
