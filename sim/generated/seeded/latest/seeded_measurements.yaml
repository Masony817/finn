schema_version: 1
gantry:
  mass_kg:
    value: 9.62
    unit: kg
    source: measured
    notes: "Weighed with luggage scale, \xB150 g uncertainty. Gantry is present during\
      \ batch 2 (loaded ground-contact) runs with casters unlocked. Mass ratio gantry/robot\
      \ \u2248 1.14, so it meaningfully biases rolling resistance and yaw response\
      \ measurements. Postprocessors should use robot.mass_kg + gantry.mass_kg as\
      \ m_system for coastdown force balance, and flag track_width from batch 2 for\
      \ manual verification against CAD.\n"
