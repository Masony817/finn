# scopik profile for finn Batch 2 (loaded-ground) telemetry.
#
# Usage:
#   uv run scopik gap --profile config/viz/finn.yaml \
#       --run logs/finn-mcu/sysid/batch_2_pass/<timestamp>
#
# The compare set mirrors tools/build_seeded_mujoco_model.py replay_batch2_open_loop
# (same sensors, same rev/s units) so scopik's RMSE numbers are directly checkable
# against sim/generated/seeded/latest/validation.json.

name: finn
model: ../../sim/generated/seeded/latest/finn.seeded.sim.xml

source:
  type: prefixed_csv
  file: telemetry.csv
  line_prefix: "data,"
  header_marker: "data,t_us,"

time:
  column: t_us
  transform: us_to_s

events:
  file: events.log
  prefix: "event,"
  time_index: 1
  time_transform: us_to_s
  phase_column: phase

signals:
  # attitude
  pitch_rad:                {unit: rad,   group: attitude}
  pitch_rate_rad_s:         {unit: rad/s, group: attitude}
  yaw_rad:                  {unit: rad,   group: attitude}
  yaw_rate_rad_s:           {unit: rad/s, group: attitude}
  # wheels
  left_pos_rev:             {unit: rev,   group: wheels}
  right_pos_rev:            {unit: rev,   group: wheels}
  left_vel_rev_s:           {unit: rev/s, group: wheels}
  right_vel_rev_s:          {unit: rev/s, group: wheels}
  # commands and measured torque
  left_cmd_nm:              {unit: "N·m", group: commands}
  right_cmd_nm:             {unit: "N·m", group: commands}
  left_torque_nm:           {unit: "N·m", group: commands}
  right_torque_nm:          {unit: "N·m", group: commands}
  # imu
  imu_gyro_x_rad_s:         {unit: rad/s, group: imu}
  imu_gyro_y_rad_s:         {unit: rad/s, group: imu}
  imu_gyro_z_rad_s:         {unit: rad/s, group: imu}
  robot_forward_accel_m_s2: {unit: "m/s²", group: imu}
  # health
  left_voltage_v:           {unit: V,     group: health}
  right_voltage_v:          {unit: V,     group: health}
  left_temp_c:              {unit: "°C",  group: health}
  right_temp_c:             {unit: "°C",  group: health}
  imu_age_ms:               {unit: ms,    group: health}

replay:
  actuators:
    motor_left_wheel: left_cmd_nm
    motor_right_wheel: right_cmd_nm
  # Batch 2 runs the real robot on an external support (gantry): it cannot
  # roll/pitch, but the bare model can - an unheld replay just falls over and
  # pollutes every signal with fall dynamics. hold_upright models an ideally
  # stiff support: roll/pitch projected out, yaw + translation free.
  hold_upright: root_freejoint
  sample:
    left_vel_rev_s:           {sensor: wheel_left_vel,    transform: rad_to_rev, unit: rev/s}
    right_vel_rev_s:          {sensor: wheel_right_vel,   transform: rad_to_rev, unit: rev/s}
    pitch_rate_rad_s:         {sensor: imu_gyro,          index: 0, unit: rad/s}
    yaw_rate_rad_s:           {sensor: imu_gyro,          index: 1, unit: rad/s}
    # MuJoCo accelerometers report specific force (gravity included);
    # the firmware's robot_forward_accel is BNO085 linear accel (gravity
    # removed). gravity_compensated subtracts R_site^T*(-g) per frame.
    # Site z = world +x = forward at upright, so no sign flip is needed.
    robot_forward_accel_m_s2:
      {sensor: imu_accelerometer, index: 2, unit: "m/s²", gravity_compensated: true}

compare:
  - {name: left_vel,      real: left_vel_rev_s,           sim: left_vel_rev_s,           unit: rev/s}
  - {name: right_vel,     real: right_vel_rev_s,          sim: right_vel_rev_s,          unit: rev/s}
  - {name: pitch_rate,    real: pitch_rate_rad_s,         sim: pitch_rate_rad_s,         unit: rad/s}
  - {name: yaw_rate,      real: yaw_rate_rad_s,           sim: yaw_rate_rad_s,           unit: rad/s}
  - {name: forward_accel, real: robot_forward_accel_m_s2, sim: robot_forward_accel_m_s2, unit: "m/s²"}
