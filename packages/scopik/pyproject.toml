[project]
name = "scopik"
version = "0.1.0"
description = "Recorded sim-to-real gap analysis on Rerun for MuJoCo robots"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rerun-sdk>=0.34,<0.35",
]

[project.optional-dependencies]
mujoco = [
    "mujoco>=3.1",
]

[project.scripts]
scopik = "scopik.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scopik"]
